# =============================================
#  iamEscri — _config.yml
# =============================================

title: iamEscri
tagline: "Hacker & Security Researcher"
description: "Writeups, proyectos y notas de un aprendiz del hacking ético."
author: iamEscri
email: ""
baseurl: ""
url: "https://iamescri.github.io"

# Redes sociales (pon tus URLs reales)
social:
  github: "https://github.com/iamEscri"
  twitter: "https://twitter.com/iamEscri"
  hackthebox: ""
  tryhackme: ""

# Jekyll build
theme: null
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  writeups:
    output: true
    permalink: /writeups/:name/

# Defaults
defaults:
  - scope:
      path: "_posts/writeups"
      type: posts
    values:
      layout: writeup
      category: writeup
  - scope:
      path: "_posts/blog"
      type: posts
    values:
      layout: post
      category: blog

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .github
