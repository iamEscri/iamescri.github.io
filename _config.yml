# =============================================
#  iamEscri — _config.yml
# =============================================

title: iamEscri
tagline: "Técnico IT (ASIR) | Ciberseguridad | Blue Team & SOC (en formación)"
description: "Portfolio de ciberseguridad enfocado en Blue Team, SOC, análisis y defensa."
author: iamEscri
avatar: /assets/favicon.png
email: "iamescricontacto@gmail.com"
baseurl: ""
url: "https://iamescri.es"

# Redes sociales (pon tus URLs reales)
social:
  github: "https://github.com/iamEscri"
  linkedin: "https://www.linkedin.com/in/alvaro-escribano-3b9a513a5/"
  hackthebox: ""
  tryhackme: ""

# Jekyll build
theme: null
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  writeups:
    output: true
    permalink: /writeups/:name/

# Defaults
defaults:
  - scope:
      path: "_posts/writeups"
      type: posts
    values:
      layout: writeup
      category: writeup
  - scope:
      path: "_posts/blog"
      type: posts
    values:
      layout: post
      category: blog
  - scope:
      path: "_posts/defensive"
      type: posts
    values:
      layout: post
      category: defensive
  - scope:
      path: "_posts/projects"
      type: posts
    values:
      layout: project
      category: projects

# Exclude from build
exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github

