# --- BIO Y ESTADO GENERAL ---

bio: >
  Técnico en Sistemas (ASIR) enfocado en ciberseguridad defensiva.
  Actualmente en formación en entornos SOC, análisis de logs y detección de amenazas.
  Trabajo con entornos Linux, redes y herramientas de seguridad, documentando todo el proceso mediante writeups y artículos técnicos.
  Mi objetivo es especializarme en Blue Team y formar parte de un SOC.

location: "España"

# Cambia a false para ocultar el widget "Disponible para trabajar"
available: true

# Texto que aparece debajo de "Disponible para trabajar"
available_roles: "Blue Team · SOC · Defensa"


# --- OBJETIVOS (terminal: cat objetivos.txt) ---
# status: "done"    → ✔ verde  (objetivo conseguido o en curso activo)
# status: "pending" → ◎ gris   (objetivo futuro o pendiente)

objetivos:
  - text: "Completar Máster en Ciberseguridad (ENNIT)"
    status: "done"
  - text: "Obtener CompTIA Security+"
    status: "done"
  - text: "Preparar eJPT / eCPPT"
    status: "pending"
  - text: "Conseguir primer empleo en SOC / Blue Team"
    status: "pending"


# --- EN DESARROLLO (panel derecho) ---
# Muestra certificaciones o proyectos que estás cursando ahora mismo.
# status: "in-progress" → se muestra con badge amarillo "en proceso"
# status: "done"        → NO se muestra (ya terminado, desaparece solo)

en_desarrollo:
