<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
{% seo %}
</head>
<body>

<!-- ===== MOBILE HAMBURGER ===== -->
<button class="hamburger" onclick="toggleSidebar()" aria-label="Menú">
  <i class="fas fa-bars"></i>
</button>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
{% include sidebar.html %}

<!-- ===== MAIN ===== -->
<div class="main">
  {% include topbar.html %}
  <div class="content">
    {{ content }}
  </div>
</div>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
