<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
{% seo %}
</head>
<body>

{% include mobile-nav.html %}

<div class="main-wrap">
  <!-- TOPNAV -->
  <nav class="topnav">
    <div class="topnav-logo" onclick="showSection('home', null)">
      <div class="topnav-logo-mark">
        <img src="/assets/logo.png" alt="iamEscri logo" style="width:50px;height:50px;object-fit:contain;">
      </div>
      <span class="topnav-logo-text">iam<span class="logo-accent">Escri</span></span>
    </div>
    <div class="topnav-links">
      <a class="topnav-link active" id="nav-home"      href="#home">Inicio</a>
      <a class="topnav-link"        id="nav-about"     href="#about">Sobre mí</a>
      <a class="topnav-link"        id="nav-defensive" href="#defensive">Defensiva</a>
      <a class="topnav-link"        id="nav-infra"     href="#infra">Infraestructura</a>
      <a class="topnav-link"        id="nav-auto"      href="#auto">Automatización</a>
      <a class="topnav-link"        id="nav-writeups"  href="#writeups">Writeups</a>
      <a class="topnav-link"        id="nav-projects"  href="#projects">Proyectos</a>
    </div>
    <div class="topnav-right">
      {% if site.data.portfolio.available %}
      <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener" class="topnav-avail">
        <div class="topnav-avail-dot"></div>Disponible
      </a>
      {% endif %}
      <a href="{{ site.social.github }}" target="_blank" rel="noopener" class="topnav-gh">GitHub →</a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    {{ content }}
  </div>

  {% include footer.html %}
</div>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
